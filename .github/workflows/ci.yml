name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers the release process when you push a tag like v1.0.0
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # Required to create a GitHub Release and upload assets

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core Model Unit Tests
        run: ./gradlew :core:model:test --no-daemon --stacktrace --info

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --info

      - name: Assemble Release APK
        # If it's a tag, we build the release variant instead of debug
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace --info
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --info
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WirelessScanner-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        # This step only runs if you explicitly push a version tag (like v1.0.1)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
